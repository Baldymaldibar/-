<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Концовка -->
  <div class="container" id="end-screen">
    <h2 class="end-subtitle">Сф пошёл не по тому пути, упал в сугроб и замёрз</h2>
    <h1 class="end-title">КОНЕЦ ИГРЫ</h1>

    <!-- Кнопка/ссылка назад -->
    <button class="back-btn" type="button" id="backBtn">Вернуться назад</button>
    <!-- Если хочешь именно ссылку, можно заменить кнопку на:
    <a class="back-btn" href="index.html">Вернуться назад</a>
    -->
  </div>

  <!-- Зимний эффект -->
  <div class="winter-fx" aria-hidden="true">
    <div class="winter-fx__tint"></div>
    <div class="winter-fx__snow" id="snow"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Диалоги (1-4) — оставил как было (если слоя нет, ничего не сломается)
      const layer = document.querySelector('.msg-seq-layer');
      if (layer) layer.classList.add('is-active');

      // Элементы
      const fx = document.querySelector('.winter-fx');
      const snow = document.getElementById('snow');
      const endScreen = document.getElementById('end-screen');
      const backBtn = document.getElementById('backBtn');

      // Назад на предыдущую страницу сайта
      if (backBtn) {
        backBtn.addEventListener('click', () => {
          if (history.length > 1) history.back();
          else window.location.href = 'index.html'; // запасной вариант
        });
      }

      function makeSnow(count) {
        if (!snow) return;
        snow.innerHTML = '';

        for (let i = 0; i < count; i++) {
          const flake = document.createElement('div');
          flake.className = 'snowflake';

          const size  = (Math.random() * 6 + 3).toFixed(1) + 'px';
          const x     = (Math.random() * 100).toFixed(2) + 'vw';
          const dur   = (Math.random() * 3 + 3.5).toFixed(2) + 's';
          const delay = (-Math.random() * 6).toFixed(2) + 's';
          const drift = ((Math.random() * 60) - 30).toFixed(1) + 'px';

          flake.style.setProperty('--size', size);
          flake.style.setProperty('--x', x);
          flake.style.setProperty('--dur', dur);
          flake.style.setProperty('--delay', delay);
          flake.style.setProperty('--drift', drift);

          snow.appendChild(flake);
        }
      }

      const FX_ON_MS = 5000;       // "синий экран" держится 5 секунд
      const FX_FADE_OUT_MS = 800;  // fade-out tint
      const SNOW_COUNT = 60;

      if (!fx) return;

      // На старте прячем надписи
      if (endScreen) endScreen.classList.remove('is-show');

      // Снег стартует сразу и будет падать ВСЕГДА
      makeSnow(SNOW_COUNT);

      // Через 5 сек убираем только tint (снег остаётся) и показываем блок
      setTimeout(() => {
        fx.classList.add('is-dim'); // прячет только tint

        setTimeout(() => {
          if (endScreen) endScreen.classList.add('is-show');
        }, FX_FADE_OUT_MS);

      }, FX_ON_MS);
    });
  </script>

</body>
</html>
